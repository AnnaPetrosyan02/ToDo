name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"] # если у тебя ветка называется master, замени main на master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'my-ts-app/package-lock.json' # Указываем путь к lock-файлу

      - name: Install dependencies
        working-directory: ./my-ts-app # Указываем рабочий каталог для команды
        run: npm ci

      - name: Build
        working-directory: ./my-ts-app # Указываем рабочий каталог для билда
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './my-ts-app/dist' # Указываем путь к папке dist внутри my-ts-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
